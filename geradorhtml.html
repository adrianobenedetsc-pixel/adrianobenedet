<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Backup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; background: #fff; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
  .sub { color: #6e6e73; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
  #zona {
    border: 1px solid #d2d2d7; border-radius: 14px; padding: 36px 20px;
    text-align: center; cursor: pointer; transition: border-color .2s;
  }
  #zona:hover, #zona.over { border-color: #0066cc; }
  #zona p { color: #6e6e73; font-size: 14px; }
  #zona strong { display: block; color: #1d1d1f; font-size: 15px; margin-bottom: 4px; word-break: break-all; }
  #arquivo { display: none; }
  button {
    width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 10px;
    background: #0066cc; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #004499; }
  button:disabled { background: #c7c7cc; cursor: default; }
  #status { margin-top: 14px; font-size: 13px; color: #6e6e73; min-height: 18px; line-height: 1.5; }
  #status.ok { color: #1a7f37; }
  #status.erro { color: #ff3b30; }
</style>
</head>
<body>
<main>
  <h1>Gerador de Backup</h1>
  <p class="sub">Escolha o seu arquivo (por exemplo, o volume do VeraCrypt). A página cria um único arquivo .html que contém ele dentro. Tudo acontece no seu computador, nada é enviado para a internet.</p>

  <div id="zona">
    <strong id="nome-escolhido">Clique ou arraste o arquivo aqui</strong>
    <p id="tam-escolhido">Qualquer tipo de arquivo</p>
  </div>
  <input type="file" id="arquivo">

  <button id="btn" disabled>Gerar backup</button>
  <p id="status"></p>
</main>

<script>
const zona = document.getElementById("zona");
const input = document.getElementById("arquivo");
const btn = document.getElementById("btn");
const status = document.getElementById("status");
let escolhido = null;

function fmt(b) {
  if (b < 1024) return b + " B";
  if (b < 1024 ** 2) return (b / 1024).toFixed(1) + " KB";
  return (b / 1024 ** 2).toFixed(1) + " MB";
}
function escolher(f) {
  if (!f) return;
  escolhido = f;
  document.getElementById("nome-escolhido").textContent = f.name;
  document.getElementById("tam-escolhido").textContent = fmt(f.size);
  btn.disabled = false;
  status.className = ""; status.textContent = "";
}

zona.addEventListener("click", () => input.click());
input.addEventListener("change", () => escolher(input.files[0]));
zona.addEventListener("dragover", (e) => { e.preventDefault(); zona.classList.add("over"); });
zona.addEventListener("dragleave", () => zona.classList.remove("over"));
zona.addEventListener("drop", (e) => { e.preventDefault(); zona.classList.remove("over"); escolher(e.dataTransfer.files[0]); });

function lerBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}
async function sha256(file) {
  if (!(window.crypto && crypto.subtle)) return "";
  const buf = await file.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// Modelo da pagina de backup (sem a palavra de fechamento de script solta)
function montarPagina(meta, b64) {
  const metaJson = JSON.stringify(meta).replace(/</g, "\\u003c");
  const fim = "<" + "/script>";
  return [
'<!DOCTYPE html>',
'<html lang="pt-BR"><head><meta charset="UTF-8">',
'<meta name="viewport" content="width=device-width, initial-scale=1.0">',
'<title>Backup - ' + meta.nome.replace(/[<>&"]/g, "") + '</title>',
'<style>',
'*{margin:0;padding:0;box-sizing:border-box}',
'body{min-height:100vh;background:#fff;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}',
'main{width:100%;max-width:440px;text-align:center}',
'h1{font-size:24px;font-weight:600;letter-spacing:-.5px;word-break:break-all;margin-bottom:6px}',
'.info{color:#6e6e73;font-size:13px;line-height:1.7;margin-bottom:24px;word-break:break-all}',
'button{width:100%;padding:13px;border:none;border-radius:10px;background:#0066cc;color:#fff;font-size:15px;cursor:pointer}',
'button:hover{background:#004499}',
'#st{margin-top:14px;font-size:13px;min-height:18px;color:#6e6e73;line-height:1.5}',
'#st.ok{color:#1a7f37}#st.erro{color:#ff3b30}',
'</style></head><body><main>',
'<h1 id="nome"></h1>',
'<p class="info" id="info"></p>',
'<button id="b">Baixar arquivo</button>',
'<p id="st"></p>',
'</main>',
'<script type="application/json" id="meta">' + metaJson + fim,
'<script type="text/plain" id="dados">' + b64 + fim,
'<script>',
'const meta=JSON.parse(document.getElementById("meta").textContent);',
'document.getElementById("nome").textContent=meta.nome;',
'document.getElementById("info").textContent="Tamanho: "+meta.tamanhoTexto+" | Criado em: "+meta.data+(meta.hash?" | SHA-256: "+meta.hash:"");',
'const st=document.getElementById("st");',
'document.getElementById("b").addEventListener("click",async()=>{',
'  st.className="";st.textContent="Preparando...";',
'  try{',
'    const bin=atob(document.getElementById("dados").textContent.trim());',
'    const arr=new Uint8Array(bin.length);',
'    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);',
'    if(meta.hash&&window.crypto&&crypto.subtle){',
'      const h=await crypto.subtle.digest("SHA-256",arr);',
'      const hex=Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");',
'      if(hex!==meta.hash){st.className="erro";st.textContent="ATENCAO: o arquivo nao confere com o original (hash diferente). Esta copia pode estar corrompida.";return;}',
'    }',
'    const blob=new Blob([arr],{type:meta.tipo||"application/octet-stream"});',
'    const a=document.createElement("a");',
'    a.href=URL.createObjectURL(blob);a.download=meta.nome;',
'    document.body.appendChild(a);a.click();a.remove();',
'    st.className="ok";st.textContent="Download iniciado"+(meta.hash?" (integridade verificada)":"")+".";',
'  }catch(e){st.className="erro";st.textContent="Erro: "+e.message;}',
'});',
fim,
'</body></html>'
  ].join("\n");
}

btn.addEventListener("click", async () => {
  if (!escolhido) return;
  btn.disabled = true;
  status.className = ""; status.textContent = "Gerando, aguarde...";
  try {
    const [b64, hash] = await Promise.all([lerBase64(escolhido), sha256(escolhido)]);
    const meta = {
      nome: escolhido.name,
      tipo: escolhido.type || "application/octet-stream",
      tamanho: escolhido.size,
      tamanhoTexto: fmt(escolhido.size),
      data: new Date().toLocaleDateString("pt-BR"),
      hash
    };
    const html = montarPagina(meta, b64);
    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup-" + escolhido.name.replace(/[^\w.\-]/g, "_") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    status.className = "ok";
    status.textContent = "Pronto! O arquivo backup-....html foi baixado (" + fmt(blob.size) + "). Teste abrindo ele e baixando o conteudo de volta antes de apagar o original.";
  } catch (e) {
    status.className = "erro";
    status.textContent = "Erro: " + e.message;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
