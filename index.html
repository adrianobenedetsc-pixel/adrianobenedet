<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="index, follow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests">
<title>Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:wght@500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#040302;
    --void-2:#0a0805;
    --gold-hi:#f0cf7e;
    --gold:#c99a3e;
    --gold-dim:#7a5a1a;
    --cream:#f4e3b0;
    --stone:#8a7a58;
    --line: rgba(201,154,62,0.22);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 1000px 600px at 50% 0%, rgba(122,90,26,0.16), transparent 60%),
      var(--void);
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ---------- header ---------- */
  header{
    max-width:1160px;
    margin:0 auto;
    padding:88px 32px 56px;
    text-align:center;
  }
  .mark{
    width:46px; height:46px;
    margin:0 auto 28px;
    opacity:0.9;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(2.6rem, 5.4vw, 4.2rem);
    letter-spacing:0.14em;
    margin:0 0 16px;
    color:var(--gold-hi);
    text-transform:uppercase;
    background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 60%, var(--gold-dim) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .lede{
    font-size:17px;
    font-style:italic;
    font-weight:400;
    color:var(--stone);
    margin:0;
    letter-spacing:0.06em;
  }

  /* ---------- gallery ---------- */
  main{
    max-width:1160px;
    margin:0 auto;
    padding:10px 32px 90px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:52px 40px;
    justify-items:center;
  }

  .book{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    width:100%;
    max-width:280px;
    opacity:0;
    animation:rise .6s ease forwards;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .cover-frame{
    position:relative;
    width:100%;
    aspect-ratio:690/1010;
    border-radius:3px;
    overflow:hidden;
    box-shadow:
      0 2px 0 rgba(240,207,126,0.06),
      0 30px 50px -20px rgba(0,0,0,0.75);
    transition:transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s ease;
  }
  .cover-frame img{
    width:100%; height:100%;
    display:block;
    object-fit:cover;
  }
  @media (hover:hover) and (pointer:fine){
    .book:hover .cover-frame{
      transform:translateY(-6px) scale(1.015);
      box-shadow:
        0 2px 0 rgba(240,207,126,0.12),
        0 40px 60px -18px rgba(0,0,0,0.85),
        0 0 0 1px rgba(201,154,62,0.3);
    }
    .book:hover .acessar{
      color:var(--void);
      background:var(--gold);
      border-color:var(--gold);
    }
  }
  .book:active .cover-frame{
    transform:scale(0.98);
  }
  .book:active .acessar{
    color:var(--void);
    background:var(--gold);
    border-color:var(--gold);
  }

  .book-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.02em;
    color:var(--cream);
    margin:18px 0 4px;
    text-align:center;
  }
  .book-sub{
    font-size:13px;
    font-style:italic;
    color:var(--stone);
    text-align:center;
    margin:0 0 14px;
  }
  .acessar{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 22px;
    transition:all .2s ease;
  }

  /* ---------- filters (only shown if >1 category present) ---------- */
  .filters{
    max-width:1160px;
    margin:0 auto;
    padding:0 32px 40px;
    display:none;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filters.show{ display:flex; }
  .filters .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:9px 16px;
    min-height:36px;
    display:inline-flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--stone);
    background:transparent;
    cursor:pointer;
    transition:all .15s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .filters .tag:hover{ border-color:var(--gold); color:var(--gold); }
  }
  .filters .tag.active{ background:var(--gold); border-color:var(--gold); color:var(--void); }

  /* ---------- footer / discreet csv loader ---------- */
  footer{
    max-width:1160px;
    margin:0 auto;
    padding:0 32px 70px;
    text-align:center;
  }
  footer p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:var(--stone);
    letter-spacing:0.02em;
    margin:0 0 10px;
  }
  footer .rule{
    width:60px;
    height:1px;
    margin:0 auto 22px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  footer .signature{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold-dim);
  }
  footer .privacy{
    max-width:420px;
    margin:26px auto 0;
    font-family:'JetBrains Mono', monospace;
    font-style:normal;
    font-size:9.5px;
    line-height:1.7;
    letter-spacing:0.02em;
    color:var(--stone);
    opacity:0.6;
    text-transform:none;
  }

  /* ---------- responsivo ---------- */
  @media (max-width:900px){
    header{ padding:64px 24px 44px; }
    main{ padding:6px 24px 70px; gap:44px 28px; }
    footer{ padding:0 24px 56px; }
  }

  @media (max-width:600px){
    header{ padding:48px 20px 36px; }
    .mark{ width:38px; height:38px; margin-bottom:20px; }
    h1{ letter-spacing:0.1em; margin-bottom:12px; }
    .lede{ font-size:15px; }
    main{
      padding:4px 20px 60px;
      grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
      gap:36px 18px;
    }
    .book{ max-width:100%; }
    .book-title{ font-size:15px; margin-top:14px; }
    .book-sub{ font-size:12px; margin-bottom:12px; }
    .filters{ padding:0 20px 32px; gap:8px; }
    footer{ padding:0 20px 48px; }
  }

  @media (max-width:380px){
    main{ grid-template-columns:1fr; max-width:340px; }
  }
</style>
</head>

    link_acesso:'#'
  }
];
let activeCat = 'Todos';

function render(){
  const grid = document.getElementById('grid');
  const cats = [...new Set(data.map(d => d.categoria).filter(Boolean))];
  const filters = document.getElementById('filters');
  if(cats.length > 1){
    filters.classList.add('show');
    filters.innerHTML = ['Todos', ...cats].map(c =>
      `<button class="tag ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    filters.querySelectorAll('.tag').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; render(); });
    });
  } else {
    filters.classList.remove('show');
    activeCat = 'Todos';
  }

  const visible = activeCat === 'Todos' ? data : data.filter(d => d.categoria === activeCat);

  grid.innerHTML = visible.map((d, i) => `
    <a class="book" href="${d.link_acesso || '#'}" target="_blank" rel="noopener noreferrer" style="animation-delay:${Math.min(i*0.05,0.4)}s">
      <div class="cover-frame">
        <img src="${d.capa || fallbackCover}" alt="Capa de ${escapeHtml(d.titulo)}">
      </div>
      <div class="book-title">${escapeHtml(d.titulo)}</div>
      ${d.subtitulo ? `<div class="book-sub">${escapeHtml(d.subtitulo)}</div>` : ''}
      <span class="acessar">Acessar</span>
    </a>
  `).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
